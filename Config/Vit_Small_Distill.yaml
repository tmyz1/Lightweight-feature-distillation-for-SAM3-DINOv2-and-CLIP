device: "cuda"

distillation:
  teacher_mode: "sam3"

multi_gpu:
  enabled: false
  backend: "gloo"
  find_unused_parameters: false

dataset:
  type: "sa1b"
  root: "F:/data/SA-1B"
  train_type: "sa1b"
  val_type: "coco"
  val_root: "F:/data/SA-1B/val"
  train_split: "sa1b"
  val_split: "val2017"
  sa1b_train_shards: null
  eval_category_chunk_size: 2
  train_num_images: 100
  val_num_images: 10
  max_objects_per_query: 800
  resolution: 1008
  num_workers: 0
  batch_size: 2
  enable_segmentation: False

Student:
  model: "vit_small"
  enable_segmentation: true
  fuse_neck_features: true
  kd_resolution: 1008
  vit_small_pos_embed_resolution: 518
  position_encoding_resolution: 1008
  vit_small_checkpoint_path: "E:/reproduce/weights/DINO-V2/vit_small_patch14_reg4_dinov2.safetensors"
  vit_small_intermediate_layers: [2, 5, 8, 11]

Sam3:
  checkpoint_path: "E:/reproduce/weights/sam3/sam3.pt"
  bpe_path: "E:/pycharm/sam3-main/sam3-main/sam3-main/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  enable_segmentation: false
  resolution: 1008
  sam3_intermediate_layers: [7,15,23,31]

CLIP:
  is_use: False
  checkpoint_path: "E:/reproduce/weights/CLIP/ViT-L-14.pt"
  bpe_path: "E:/pycharm/sam3-main/sam3-main/sam3-main/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  resolution: 224
  clip_intermediate_layers: [5,11,17,23]

DINO_V2:
  is_use: False
  checkpoint: "E:/reproduce/weights/DINO-V2/dinov2_vitl14_reg4_pretrain.pth"
  bpe_path: "E:/pycharm/sam3-main/sam3-main/sam3-main/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  resolution: 224
  dino_v2_intermediate_layers: [5,11,17,23]

Adapter:
  student_channel: [384]
  student_cls_channel: [384]
  teacher_channel: [1024]

optim:
  min_lr: 5.0e-7
  trunk_lr: 2.0e-4
  neck_lr: 1e-4
  adapter_lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05
  max_grad_norm: 1.0

param_scheduler:
  warmup_updates: 5000
  warmup_start_factor: 0.05
  min_lr: 5.0e-7

loss:
  mask_sam3_padding: true
  features_loss_weight: 0
  necks_loss_weight: 1.0
  cls_tokens_loss_weight: 0.10
  normalize_features: true
  sam3_features_weight: 1.0
  dino_v2_features_weight: 0.15
  clip_features_weight: 0.15
  losses_type: ["cosine", "mse"]
  cls_losses_type: ["cosine", "smooth_l1"]
  features_loss:
    cosine: 0.1
    mse: 0.9
  cls_token_loss:
    cosine: 0.5
    smooth_l1: 0.5

train:
  max_steps: 2
  eval_every_steps: 1
  log_every_batches: 50
  amp: true
  seed: 123
  return_interm_layers: True

eval:
  enabled: true
  amp: true
  max_dets: 100
  log_every_batches: 50
  output_dir: "KD/eval_outputs/vit_small"
