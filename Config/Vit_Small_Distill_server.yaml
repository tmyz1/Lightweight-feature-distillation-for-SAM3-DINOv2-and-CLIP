device: "cuda"

distillation:
  teacher_mode: "sam3"

multi_gpu:
  enabled: True
  backend: "nccl"
  find_unused_parameters: True

dataset:
  root: "/data/db1/sa1b"
  val_root: "/data/db1/coco"
  train_split: "images"
  val_split: "val2017"
  eval_category_chunk_size: 4
  train_num_images: null
  val_num_images: 100
  max_objects_per_query: 800
  resolution: 1008
  num_workers: 16
  batch_size: 8
  enable_segmentation: False

Student:
  model: "vit_small"
  enable_segmentation: true
  fuse_neck_features: true
  kd_resolution: 1008
  vit_small_pos_embed_resolution: 518
  position_encoding_resolution: 1008
  vit_small_checkpoint_path: "/workspace/weight/vit_small_patch14_reg4_dinov2.safetensors"
  vit_small_intermediate_layers: [2, 5, 8, 11]

Sam3:
  checkpoint_path: "/workspace/weight/sam3.pt"
  bpe_path: "/workspace/Vision Distillation/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  enable_segmentation: false
  resolution: 1008
  sam3_intermediate_layers: [7,15,23,31]

CLIP:
  is_use: False
  checkpoint_path: "/workspace/weight/ViT-L-14.pt"
  bpe_path: "/workspace/Vision Distillation/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  resolution: 224
  clip_intermediate_layers: [5,11,17,23]

DINO_V2:
  is_use: False
  checkpoint: "/workspace/weight/dinov2_vitl14_reg4_pretrain.pth"
  bpe_path: "/workspace/Vision Distillation/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  resolution: 224
  dino_v2_intermediate_layers: [5,11,17,23]

Adapter:
  student_channel: [384]
  student_cls_channel: [384]
  teacher_channel: [1024]

optim:
  min_lr: 5.0e-7
  trunk_lr: 5.0e-4
  neck_lr: 5.0e-4
  adapter_lr: 2.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05
  max_grad_norm: 1.0

param_scheduler:
  warmup_updates: 5000
  warmup_start_factor: 0.05
  min_lr: 5.0e-6

loss:
  mask_sam3_padding: true
  features_loss_weight: 0.5
  necks_loss_weight: 0.5
  cls_tokens_loss_weight: 0
  normalize_features: true
  sam3_features_weight: 1.0
  dino_v2_features_weight: 0.5
  clip_features_weight: 0.5
  losses_type: ["mse"]
  cls_losses_type: ["cosine", "smooth_l1"]
  features_loss:
    cosine: 0.1
    mse: 0.9
  cls_token_loss:
    cosine: 0.5
    smooth_l1: 0.5

train:
  max_steps: 12
  eval_every_steps: 1
  log_every_batches: 50
  amp: true
  seed: 123
  return_interm_layers: True

eval:
  enabled: true
  amp: true
  max_dets: 100
  log_every_batches: 50
  output_dir: "/workspace/Vision Distillation output/eval"
