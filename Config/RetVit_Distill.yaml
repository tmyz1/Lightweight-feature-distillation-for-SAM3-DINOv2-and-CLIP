device: "cuda"

dataset:
  root: "E:/my_data/COCO"
  train_split: "train2017"
  val_split: "val2017"
  eval_category_chunk_size: 2
  train_num_images: null #null表示训练所有的数据
  val_num_images: 100
  resolution: 1008
  num_workers: 0
  batch_size: 4
  enable_segmentation: false

Student:
  model: "repvit"
  kd_resolution: 1008
  position_encoding_resolution: 1008
  repvit_checkpoint_path: "E:/reproduce/weights/RepVit/repvit_m1_1_distill_450e.pth"
  repvit_arch: "m1_1"
  strict_pretrained: false
  repvit_neck:
    d_model: 256
    vit_feature_size: [72, 72]
    scale_factors: [4.0, 2.0, 1.0, 0.5]

Sam3:
  checkpoint_path: "E:/reproduce/weights/sam3/sam3.pt"
  bpe_path: "E:/pycharm/sam3-main/sam3-main/sam3-main/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  enable_segmentation: false
  sam3_intermediate_layers: [7，15，23，31]

CLIP:
  checkpoint_path: "E:/reproduce/weights/CLIP/ViT-L-14.pt"
  bpe_path: "E:/pycharm/sam3-main/sam3-main/sam3-main/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  resolution: 224
  clip_intermediate_layers: [5，11，17，23]

DINO_V2:
  checkpoint: "E:/reproduce/weights/DINO-V2/dinov2_vitl14_reg4_pretrain.pth"
  bpe_path: "E:/pycharm/sam3-main/sam3-main/sam3-main/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  resolution: 224
  dino_v2_intermediate_layers: [5，11，17，23]

Adapter:
  student_channel: [256]
  student_cls_channel: [256]
  teacher_channel: [1024]
  target_sizes:
    - [72, 72]

optim:
  min_lr: 1.0e-6
  trunk_lr: 1.0e-4
  neck_lr: 2.0e-4
  adapter_lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05
  max_grad_norm: 1.0

param_scheduler:
  warmup_updates: 500
  warmup_start_factor: 0.1
  min_lr: 1.0e-6

loss:
  mask_sam3_padding: true
  features_loss_weight: 0.35
  necks_loss_weight: 0.50
  cls_tokens_loss_weight: 0.15
  normalize_features: true
  sam3_features_weight: 1.0
  dino_v2_features_weight: 0.15
  clip_features_weight: 0.15
  losses_type: ["cosine", "smooth_l1"]
  features_loss:
    cosine: 0.5
    smooth_l1: 0.5
  cls_token_loss:
    cosine: 0.5
    smooth_l1: 0.5

train:
  max_steps: 10
  eval_every_steps: 1
  log_every_batches: 20
  amp: true
  seed: 123
  return_interm_layers: false

eval:
  enabled: true
  amp: true
  max_dets: 100
  log_every_batches: 20
  output_dir: "KD/eval_outputs/repvit"

